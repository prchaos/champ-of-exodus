apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: champ-frontend
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    spec:
      containers:
        - image: us-central1-docker.pkg.dev/PROJECT_ID/champ-of-exodus/frontend:latest
          ports:
            - containerPort: 3000
          # NOTE: env vars (DATABASE_URL, NEXTAUTH_URL, NEXTAUTH_SECRET,
          # AUTH_DISCORD_ID, AUTH_DISCORD_SECRET) and their Secret Manager
          # wiring are configured in Phase 7 alongside Cloud SQL provisioning.
