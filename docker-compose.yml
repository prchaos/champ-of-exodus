services:
  db:
    image: postgres:16-alpine
    container_name: champ-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-champ_of_exodus}
    ports:
      - "5432:5432"
    volumes:
      - champ-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    container_name: champ-frontend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-champ_of_exodus}?schema=public
      WOM_GROUP_ID: ${WOM_GROUP_ID:-15387}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  champ-db-data:
