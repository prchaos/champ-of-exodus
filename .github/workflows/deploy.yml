name: Deploy to Cloud Run

# Requires one-time manual setup before this can run at all — see
# README.md "One-Time Infrastructure Setup" (state bucket, Artifact
# Registry repo, KMS keyring/key, Workload Identity Federation, the
# `production` GitHub Environment with required reviewers).

on:
  push:
    branches: [main]

env:
  PROJECT_ID: ashendeng-dev
  REGION: us-central1
  REPOSITORY: champ-of-exodus
  SERVICE: champ-frontend
  IMAGE: us-central1-docker.pkg.dev/ashendeng-dev/champ-of-exodus/frontend
  EVENTS_ADMIN_SERVICE: champ-events-admin
  EVENTS_ADMIN_IMAGE: us-central1-docker.pkg.dev/ashendeng-dev/champ-of-exodus/events-admin
  # Replace PROJECT_NUMBER with the real value from:
  #   gcloud projects describe ashendeng-dev --format='value(projectNumber)'
  WORKLOAD_IDENTITY_PROVIDER: projects/721387251831/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  DEPLOY_SERVICE_ACCOUNT: champ-deploy@ashendeng-dev.iam.gserviceaccount.com

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation — do not remove

jobs:
  build-plan:
    name: Build, plan, push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Decrypt secrets
        run: bash scripts/kms-decrypt-secrets.sh

      - name: Generate Terraform tfvars from decrypted secrets
        run: bash scripts/generate-tfvars-json.sh

      - name: Build Docker images
        run: |
          docker build -t "${IMAGE}:${GITHUB_SHA}" ./frontend
          docker build -t "${EVENTS_ADMIN_IMAGE}:${GITHUB_SHA}" ./events-admin

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init

      - name: Terraform plan
        working-directory: infra/terraform
        run: terraform plan -out=tfplan

      - name: Post plan to job summary
        working-directory: infra/terraform
        run: terraform show -no-color tfplan >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Push Docker images
        run: |
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${EVENTS_ADMIN_IMAGE}:${GITHUB_SHA}"

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/terraform/tfplan
          retention-days: 1

  approve-and-deploy:
    name: Deploy to Production?
    needs: build-plan
    runs-on: ubuntu-latest
    environment: production # this is the manual approval gate
    steps:
      - uses: actions/checkout@v4

      - name: Download Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra/terraform

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Decrypt secrets
        run: bash scripts/kms-decrypt-secrets.sh

      - name: Generate Terraform tfvars from decrypted secrets
        run: bash scripts/generate-tfvars-json.sh

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init

      - name: Terraform apply
        working-directory: infra/terraform
        run: terraform apply tfplan

      # Runs after Terraform apply so events_admin_app / events_admin_events_writer
      # and the Cloud SQL instance already exist, and before events-admin's own
      # deploy so the running container never serves against a schema its
      # migrations haven't reached yet.
      - name: Start Cloud SQL Auth Proxy
        run: |
          curl -sSL -o cloud-sql-proxy \
            "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.0/cloud-sql-proxy.linux.amd64"
          chmod +x cloud-sql-proxy
          CONNECTION_NAME="$(terraform -chdir=infra/terraform output -raw cloudsql_connection_name)"
          ./cloud-sql-proxy --port 5432 "${CONNECTION_NAME}" &
          for i in $(seq 1 15); do
            (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1 && break
            sleep 1
          done

      - name: Apply events-admin database migrations
        working-directory: events-admin
        run: |
          set -euo pipefail
          # Percent-encode: base64 passwords can contain / + = which break URL parsing.
          urlencode() { printf '%s' "$1" | python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.stdin.read(), safe=""))'; }
          # Migrations run as champ_app, the owner of champ_of_exodus's tables.
          # events_admin_events_writer only has SELECT/INSERT/UPDATE on "Event" and
          # is used by the running service alone (see the Cloud Run secret wiring).
          DB_PW="$(urlencode "$(grep '^EVENTS_ADMIN_DB_PASSWORD=' ../secrets/prod.env | cut -d= -f2-)")"
          APP_PW="$(urlencode "$(grep '^DB_PASSWORD=' ../secrets/prod.env | cut -d= -f2-)")"
          export ADMIN_DATABASE_URL="postgresql://events_admin_app:${DB_PW}@127.0.0.1:5432/events_admin?schema=public"
          export EVENTS_DATABASE_URL="postgresql://champ_app:${APP_PW}@127.0.0.1:5432/champ_of_exodus?schema=public"
          npm ci
          bash scripts/migrate.sh

      - name: Deploy champ-frontend to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy champ-events-admin to Cloud Run
        id: deploy-events-admin
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.EVENTS_ADMIN_SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.EVENTS_ADMIN_IMAGE }}:${{ github.sha }}

      - name: Print deployed URLs
        run: |
          echo "Deployed champ-frontend to ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed champ-events-admin to ${{ steps.deploy-events-admin.outputs.url }} (not publicly invokable — see README 'events-admin extras')" >> "$GITHUB_STEP_SUMMARY"
